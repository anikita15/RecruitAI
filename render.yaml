services:
  # ---------- Frontend ----------
  - type: web
    name: recruitai-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://recruitai-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_BACKEND_URL
        value: https://recruitai-backend.onrender.com
      - key: VITE_AI_URL
        value: https://recruitai-ai.onrender.com

  # ---------- Backend ----------
  - type: web
    name: recruitai-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: recruitai-db
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: recruitai-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: recruitai-db
          property: password
      - key: REDIS_URL
        fromService:
          name: recruitai-redis
          type: redis
          property: connectionString
      - key: AI_SERVICE_URL
        value: https://recruitai-ai.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: "*"

  # ---------- AI Service ----------
  - type: web
    name: recruitai-ai
    env: docker
    dockerfilePath: ai-service/Dockerfile
    dockerContext: ai-service
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: recruitai-db
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: recruitai-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: recruitai-db
          property: password
      - key: REDIS_URL
        fromService:
          name: recruitai-redis
          type: redis
          property: connectionString

  # ---------- Managed Redis ----------
  - type: redis
    name: recruitai-redis
    ipAllowList: []
    plan: starter

databases:
  - name: recruitai-db
    plan: starter
