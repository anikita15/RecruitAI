# ============================================
# Resume Screening System - Application Config
# ============================================

# Server
server.port=8080

# ---- Database (MySQL) ----
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---- File Upload ----
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=50MB

# File storage directory
app.upload.dir=./uploads

# ---- AI Python Microservice ----
app.ai.service.url=${AI_SERVICE_URL}
app.ai.analysis.mode=llm

# ---- Redis (Task Tracking) ----
spring.data.redis.url=${REDIS_URL}

# ---- CORS ----
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# ---- Logging ----
logging.level.com.resumescreen=DEBUG
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ---- Actuator ----
management.endpoints.web.exposure.include=health,info,metrics

# ---- Security (JWT) ----
app.jwtSecret=RecruitAI_SuperSecret_Security_Key_2026_Secure_SaaS_Platform
app.jwtExpirationMs=86400000
