# ============================================
# Resume Screening System - Application Config
# ============================================

# Server
server.port=8080

# ---- Database (MySQL) ----
spring.datasource.url=jdbc:mysql://localhost:3306/resume_screen?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---- File Upload ----
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=50MB

# File storage directory
app.upload.dir=./uploads

# ---- AI Python Microservice ----
app.ai.service.url=http://localhost:8000
app.ai.analysis.mode=llm

# ---- Redis (Task Tracking) ----
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ---- CORS ----
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# ---- Logging ----
logging.level.com.resumescreen=DEBUG
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ---- Actuator ----
management.endpoints.web.exposure.include=health,info,metrics

# ---- Security (JWT) ----
app.jwtSecret=RecruitAI_SuperSecret_Security_Key_2026_Secure_SaaS_Platform
app.jwtExpirationMs=86400000
